name: Fixed-main MAP thumbnail candidate BAABBA

on:
  push:
    branches: [codex/map-render-paired-cf36]

permissions:
  contents: read

concurrency:
  group: map-thumbnail-cf36-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cf36cd2bf1d447a887d3ea4d19611020368de22c
          path: build/map-thumbnail-base
          persist-credentials: false
      - uses: ./build/map-thumbnail-base/.github/actions/setup-flutter
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Prepare, prove byte equality, then run fixed serial groups
        timeout-minutes: 25
        run: >-
          python3 tool/perf/map_thumbnail_candidate/run.py
          --base build/map-thumbnail-base
          --work build/map-thumbnail-work
          --output build/map-thumbnail-evidence
      - name: Validate every planned slot and retain comparator outcomes
        if: always()
        timeout-minutes: 5
        run: >-
          python3 tool/perf/map_thumbnail_candidate/validate.py
          --output build/map-thumbnail-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: map-thumbnail-cf36-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: build/map-thumbnail-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
