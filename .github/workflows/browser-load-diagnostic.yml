name: One complete WLD browser load diagnostic

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/browser-load-diagnostic.yml'
      - 'tool/perf/browser_load_*'
      - 'tool/perf/BROWSER_LOAD_DIAGNOSTIC.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Independent opt-in job: never supersede or cancel acceptance/performance CI.
concurrency:
  group: browser-load-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  scope:
    name: Decide whether this event requests a browser measurement
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 tool/perf/browser_load_diagnostic.py scope

  browser:
    name: One original File to ready to close lifecycle
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Lightweight diagnostic contracts
        run: |
          python3 -m unittest discover -s tool/perf -p 'browser_load_checks_test.py'
          node --test tool/perf/browser_load_driver_test.mjs
      - name: Verify and download existing official Web artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/perf/browser_load_diagnostic.py prepare
      - name: Fetch the pinned public fixture only
        run: python3 tool/computerraria_inputs.py
      - name: One bounded sandboxed Chrome reproduction
        timeout-minutes: 15
        run: python3 tool/perf/browser_load_diagnostic.py run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-load-diagnostic-${{ github.run_id }}
          path: build/browser-load-diagnostic/evidence/
          if-no-files-found: error
          retention-days: 30
