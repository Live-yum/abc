name: Fixed-baseline full-shell paired profile

on:
  push:
    branches: [codex/ui-shell-paired-cf36]

permissions:
  contents: read

concurrency:
  group: computer-shell-paired-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  LIBGL_ALWAYS_SOFTWARE: '1'
  TERRA_PERF_RUNNER: ubuntu-24.04-xvfb-full-shell

jobs:
  paired:
    name: Full TerraWorkspace / three paired fresh-process runs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux profile and display dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libstdc++-12-dev zlib1g-dev xvfb mesa-utils
      - uses: ./.github/actions/setup-performance
      - name: Verify exact baseline exists and prepare pinned public world
        run: |
          git cat-file -e cf36cd2bf1d447a887d3ea4d19611020368de22c^{commit}
          python3 tool/computerraria_inputs.py
          mkdir -p build/computer-shell-paired
          cp build/public-computerraria/input-manifest.json build/computer-shell-paired/
          echo "COMPUTERRARIA_WLD=$PWD/build/public-computerraria/computerraria.wld" >> "$GITHUB_ENV"
      - name: Format candidate Dart sources with the pinned official SDK
        run: |
          dart format \
            lib/ui/terra_contract.dart lib/ui/terra_app.dart \
            lib/application/workspace.dart lib/engine/world_circuit_session.dart \
            integration_test/support/profile_controller.dart \
            integration_test/computer_shell_profile_test.dart \
            test/workspace_circuit_updates_test.dart \
            test/world_circuit_runtime_notifications_test.dart
          git diff --binary > build/computer-shell-paired/format.patch
          tar -czf build/computer-shell-paired/formatted-sources.tar.gz \
            lib/ui/terra_contract.dart lib/ui/terra_app.dart \
            lib/application/workspace.dart lib/engine/world_circuit_session.dart \
            integration_test/support/profile_controller.dart \
            integration_test/computer_shell_profile_test.dart \
            test/workspace_circuit_updates_test.dart \
            test/world_circuit_runtime_notifications_test.dart \
            tool/perf/computer_shell_paired.py \
            tool/perf/computer_shell_paired_test.py \
            .github/workflows/computer-shell-paired.yml
      - name: Validate pairing and incomplete-measurement protections
        run: python3 -m unittest discover -s tool/perf -p 'computer_shell_paired_test.py'
      - name: Check static analysis
        run: flutter analyze --no-pub
      - name: Notification, snapshot, responsive layout and lifecycle regression tests
        timeout-minutes: 6
        run: >-
          flutter test --no-pub --concurrency=1
          test/workspace_circuit_updates_test.dart
          test/world_circuit_runtime_notifications_test.dart
          test/workspace_view_snapshot_test.dart
          test/terra_ui_test.dart
          test/world_circuit_session_test.dart
          test/world_circuit_panel_test.dart
          test/world_circuit_load_workspace_test.dart
          test/world_circuit_load_diagnostics_test.dart
          test/world_circuit_progress_lifecycle_test.dart
          test/computer_circuit_session_test.dart
          test/computer_runtime_batch_test.dart
          test/computer_workspace_test.dart
          test/computer_display_test.dart
          test/computer_provenance_test.dart
          test/computer_profile_input_test.dart
      - name: Record the actual software renderer
        run: |
          xvfb-run -a -s '-screen 0 1440x1000x24' glxinfo -B > build/computer-shell-paired/glxinfo.txt
          renderer="$(sed -n 's/^OpenGL renderer string: //p' build/computer-shell-paired/glxinfo.txt)"
          test -n "$renderer"
          echo "TERRA_PERF_RENDERER=$renderer" >> "$GITHUB_ENV"
      - name: Six prebuilt application processes / BAABBA / 30-second windows
        run: >-
          xvfb-run -a -s '-screen 0 1440x1000x24'
          python3 tool/perf/computer_shell_paired.py
          "$RUNNER_TEMP/shell-paired-results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: full-shell-paired-${{ github.sha }}
          path: |
            build/computer-shell-paired/
            ${{ runner.temp }}/shell-paired-results/
          if-no-files-found: error
          retention-days: 30
      - name: Upload compact shell profile logs and reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: full-shell-paired-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/shell-paired-results/*.log
            ${{ runner.temp }}/shell-paired-results/*.json
          if-no-files-found: warn
          retention-days: 30
