name: terraforge
description: A local-first, cross-platform Terraria workspace.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.6'
dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  ffi: ^2.1.4
  flutter_js: 0.8.7
  http: ^1.6.0
  image: ^4.5.4
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  archive: 4.3.0
  pointycastle: ^4.0.0
  share_plus: ^13.3.1
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  vm_service: 15.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/computer/
    - assets/qa/
    - assets/private/
    - assets/fonts/LICENSE.txt
    - assets/fonts/PROVENANCE.md
  fonts:
    - family: TerraForge CJK
      fonts:
        - asset: assets/fonts/TerraForgeCJK-Regular.otf
          weight: 400
