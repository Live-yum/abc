name: Fixed 9d4 single application allocation pair

on:
  push:
    branches: [codex/memory-allocation-application-9d4]

permissions:
  contents: read

concurrency:
  group: gperftools-application-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  LIBGL_ALWAYS_SOFTWARE: '1'
  ABC_PERF_COMMIT: ${{ github.sha }}
  TERRA_PERF_RUNNER: ubuntu-24.04-xvfb
  GPERFTOOLS_VERSION: 2.15-3build1

jobs:
  single-application-pair:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/memory-allocation-application-9d4' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Independent fixed shipping tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9d4cd5a0f9db03042a3986689fea374ba92d78b8
          path: build/memory-owner-base
          persist-credentials: false
      - name: Independent reviewed original diagnostic tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5a161bf1215361e56358ed6476dbf97a69e53803
          path: build/memory-owner-inherited
          persist-credentials: false
      - name: Verify full product, inherited workload and new source overlay
        timeout-minutes: 4
        run: |
          set -euo pipefail
          mkdir -p build/gperftools-application-evidence
          (cd build/memory-owner-base && python3 tool/verify_authorized_sources.py) > build/gperftools-application-evidence/shipping-verifier.log 2>&1
          python3 tool/perf/gperftools_application/application_source.py --base-root build/memory-owner-base --inherited-root build/memory-owner-inherited --output build/gperftools-application-evidence/source-proof.json
      - name: Resolve exact official packages and ordinary Linux build dependencies
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::http::AllowRedirect=false -o Acquire::https::AllowRedirect=false -o Acquire::AllowInsecureRepositories=false -o Acquire::AllowWeakRepositories=false -o Acquire::AllowDowngradeToInsecureRepositories=false update 2>&1 | tee build/gperftools-application-evidence/apt-update.log
          sudo apt-get -o Acquire::http::AllowRedirect=false -o Acquire::https::AllowRedirect=false -o Acquire::AllowInsecureRepositories=false -o Acquire::AllowWeakRepositories=false -o Acquire::AllowDowngradeToInsecureRepositories=false install -y --no-install-recommends "libgoogle-perftools4t64=$GPERFTOOLS_VERSION" "libgoogle-perftools-dev=$GPERFTOOLS_VERSION" "google-perftools=$GPERFTOOLS_VERSION" build-essential binutils gzip zstd clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev zlib1g-dev xvfb mesa-utils 2>&1 | tee build/gperftools-application-evidence/apt-install.log
          mkdir -p build/gperftools-packages
          (cd build/gperftools-packages && apt-get -o Acquire::http::AllowRedirect=false -o Acquire::https::AllowRedirect=false -o Acquire::AllowInsecureRepositories=false -o Acquire::AllowWeakRepositories=false -o Acquire::AllowDowngradeToInsecureRepositories=false download "libgoogle-perftools4t64=$GPERFTOOLS_VERSION" "libgoogle-perftools-dev=$GPERFTOOLS_VERSION" "google-perftools=$GPERFTOOLS_VERSION") 2>&1 | tee build/gperftools-application-evidence/apt-download.log
      - name: Offline parser, native ABI, launcher and application failure contracts
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python3 tool/perf/gperftools_application/test_dart_source_contract.py 2>&1 | tee build/gperftools-application-evidence/harness-contracts.log
          python3 -m unittest discover -s tool/perf/gperftools_preflight -p 'test_*.py' -v 2>&1 | tee build/gperftools-application-evidence/package-contracts.log
          python3 -m unittest discover -s tool/perf/gperftools_application_contracts -p 'test_*.py' -v 2>&1 | tee build/gperftools-application-evidence/capture-contracts.log
          python3 -m unittest discover -s tool/perf/gperftools_application -p 'test_runner_*.py' -v 2>&1 | tee build/gperftools-application-evidence/runner-contracts.log
      - name: Verify unchanged official package identity without a synthetic capture
        timeout-minutes: 12
        run: python3 tool/perf/gperftools_application/official_package_gate.py --output build/gperftools-official-package --deb-dir build/gperftools-packages --apt-download-log build/gperftools-application-evidence/apt-download.log
      - uses: ./.github/actions/setup-flutter
      - name: Resolve original lockfile and inspect Dart without changing sealed sources
        timeout-minutes: 5
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart format --output=show integration_test/computer_memory_ownership_test.dart integration_test/support/memory_allocation_stack_probe.dart > build/gperftools-application-evidence/official-format.txt
          flutter analyze --no-pub 2>&1 | tee build/gperftools-application-evidence/flutter-analyze.log
      - name: Original native OFF equivalence and isolated libc helper
        timeout-minutes: 8
        run: python3 tool/perf/memory_ownership_native_contracts.py prepare --base-root build/memory-owner-base --output build/gperftools-application-evidence/native
      - name: Resolve exact original public WLD after all preflight gates
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python3 tool/computerraria_inputs.py
          mkdir -p build/gperftools-application-tmp
          echo "TMPDIR=$PWD/build/gperftools-application-tmp" >> "$GITHUB_ENV"
          echo "COMPUTERRARIA_WLD=$PWD/build/public-computerraria/computerraria.wld" >> "$GITHUB_ENV"
          xvfb-run -a -s '-screen 0 1440x1000x24' glxinfo -B > build/gperftools-application-evidence/glxinfo.txt
          renderer="$(sed -n 's/^OpenGL renderer string: //p' build/gperftools-application-evidence/glxinfo.txt)"
          test -n "$renderer"
          echo "TERRA_PERF_RENDERER=$renderer" >> "$GITHUB_ENV"
      - name: One integration build and exactly one control then one product arm
        timeout-minutes: 34
        run: >-
          xvfb-run -a -s '-screen 0 1440x1000x24'
          python3 tool/perf/gperftools_application/run_pair.py build/gperftools-application-runs
          --source-proof build/gperftools-application-evidence/source-proof.json
          --package-proof build/gperftools-official-package/manifest.json
          --helper "$RUNNER_TEMP/memory-owner-helper/libabc_native_owner_libc.so"
          --helper-build "$RUNNER_TEMP/memory-owner-helper/helper-build.json"
      - name: Preserve small identity, outcome and integer-analysis summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-summary-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/gperftools-application-evidence/source-proof.json
            build/gperftools-official-package/manifest.json
            build/gperftools-application-runs/*.json
            build/gperftools-application-runs/*/summary.json
            build/gperftools-application-runs/*/stack-summary.json
            build/gperftools-application-runs/*/execution.json
            build/gperftools-application-runs/*/driver-command/command.json
            build/gperftools-application-runs/stack-attribution/*.json
            build/gperftools-application-runs/stack-attribution/commands/*/command.json
      - name: Preserve preflight and full command logs separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-logs-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            build/gperftools-application-evidence
            build/gperftools-official-package/logs
            build/gperftools-application-runs/*/driver-command/*.log
            build/gperftools-application-runs/stack-attribution/commands/*/*.log
      - name: Preserve all sealed ELF and official package bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-code-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            build/gperftools-application-runs/stack-attribution/modules
            build/gperftools-application-runs/stack-attribution/sealed-launcher
            build/gperftools-application-runs/stack-attribution/libabc_quiet_dump.so
            build/gperftools-application-runs/stack-attribution/sealed-config.h
            build/gperftools-application-runs/stack-attribution/loaded-*
            build/gperftools-application-runs/*/code
            build/gperftools-official-package/package-bytes
            build/gperftools-packages
      - name: Preserve original probe-only scalar and raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-original-probe-only-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            build/gperftools-application-runs/probe-only/*.json
            build/gperftools-application-runs/probe-only/raw
      - name: Preserve probe-only native heap and map receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-captures-probe-only-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: build/gperftools-application-runs/probe-only/stack-attribution
      - name: Preserve probe-only q0 official inuse_space integers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-probe-only-q0-inuse_space-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: build/gperftools-application-runs/stack-attribution/probe-only-q0.inuse_space.raw
      - name: Preserve probe-only q0 official inuse_objects integers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-probe-only-q0-inuse_objects-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: build/gperftools-application-runs/stack-attribution/probe-only-q0.inuse_objects.raw
      - name: Preserve probe-only q7 official inuse_space integers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-probe-only-q7-inuse_space-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: build/gperftools-application-runs/stack-attribution/probe-only-q7.inuse_space.raw
      - name: Preserve probe-only q7 official inuse_objects integers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-probe-only-q7-inuse_objects-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: build/gperftools-application-runs/stack-attribution/probe-only-q7.inuse_objects.raw
      - name: Preserve original product-with-ownership scalar and raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-original-product-with-ownership-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            build/gperftools-application-runs/product-with-ownership/*.json
            build/gperftools-application-runs/product-with-ownership/raw
      - name: Preserve product-with-ownership native heap and map receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-captures-product-with-ownership-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: build/gperftools-application-runs/product-with-ownership/stack-attribution
      - name: Preserve product-with-ownership q0 official inuse_space integers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-product-with-ownership-q0-inuse_space-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: build/gperftools-application-runs/stack-attribution/product-with-ownership-q0.inuse_space.raw
      - name: Preserve product-with-ownership q0 official inuse_objects integers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-product-with-ownership-q0-inuse_objects-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: build/gperftools-application-runs/stack-attribution/product-with-ownership-q0.inuse_objects.raw
      - name: Preserve product-with-ownership q7 official inuse_space integers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-product-with-ownership-q7-inuse_space-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: build/gperftools-application-runs/stack-attribution/product-with-ownership-q7.inuse_space.raw
      - name: Preserve product-with-ownership q7 official inuse_objects integers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gperftools-application-product-with-ownership-q7-inuse_objects-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: build/gperftools-application-runs/stack-attribution/product-with-ownership-q7.inuse_objects.raw
