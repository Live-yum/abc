name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CI: 'true'

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks-and-web:
    name: Analyze, tests, and Web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:sources
      - run: npm run build:circuit-rules
      - name: Check reproducible rules artifacts
        run: git diff --exit-code -- assets/private/circuit_rules_native.js assets/private/circuit_rules.provenance.json web/engine/circuit_rules_web.js
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test native
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency=1 --coverage
      - name: Install pinned official Emscripten
        run: |
          git clone --depth 1 --branch 5.0.7 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "41190c21c662e9cc1962aea94e71cbae9fd2fc87"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.7
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.7
      - name: Build authoritative Web engines
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ABC_WEB_OUTPUT="$PWD/web/engine" bash tool/build_web_engine.sh
      - name: Real Web engine contracts with synthetic fixtures
        run: |
          mkdir -p build
          python3 native/generate_world_fixture.py build/synthetic.wld
          python3 native/generate_region_object_fixture.py build/objects.wld
          python3 native/generate_circuit_fixture.py build/circuit.wld
          python3 native/generate_circuit_fragment_fixture.py build/fragments.wld
          export TERRA_WORLD_RUNTIME="$PWD/web/engine/world.js"
          export TERRA_PLAYER_RUNTIME="$PWD/web/engine/player.js"
          export TERRA_WLD_FIXTURE="$PWD/build/synthetic.wld"
          export TERRA_OBJECT_FIXTURE="$PWD/build/objects.wld"
          node tool/test_web_engine.mjs
          TERRA_WLD_FIXTURE="$PWD/build/circuit.wld" node tool/test_web_engine.mjs
          node test/web/world_export_smoke.cjs
          node tool/test_web_region.mjs
          node tool/test_web_markers.mjs
          node tool/test_web_world_rules.mjs
          node tool/test_web_circuit.mjs
          node test/web/world_circuit_smoke.cjs web/engine/world.js web/engine/world.wasm build/circuit.wld
          node test/web/world_circuit_fragments_smoke.cjs web/engine/world.js web/engine/world.wasm build/fragments.wld
      - name: Authoritative source and actual Web-worker parity
        run: |
          export TERRA_CIRCUIT_SOURCE="$PWD/vendor/viewer-circuit"
          export TERRA_WORLD_RUNTIME="$PWD/web/engine/world.js"
          node tool/test_circuit_rules.mjs
          node --test test/web/circuit_rules_lifecycle.cjs
          node test/web/circuit_rules_worker_smoke.cjs
      - run: flutter build web --release --no-pub --no-web-resources-cdn

  native-contract:
    name: Native engine ASan and UBSan contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:sources
      - run: npm run build:circuit-rules
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake zlib1g-dev
      - run: flutter pub get --enforce-lockfile
      - name: Generate synthetic fixtures
        run: |
          mkdir -p build
          python3 native/generate_world_fixture.py build/synthetic.wld
          python3 native/generate_circuit_fixture.py build/circuit.wld
          python3 native/generate_circuit_fragment_fixture.py build/fragments.wld
          python3 native/generate_region_object_fixture.py build/objects.wld
          dart run native/generate_player_fixture.dart build/synthetic-player.json
      - name: Build instrumented C engine
        run: |
          cmake -S native -B build/native -DABC_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native --parallel 2
          cc -g -fsanitize=address,undefined -fno-omit-frame-pointer -I native native/native_contract.c -L build/native -labc_engine -Wl,-rpath,"$PWD/build/native" -o build/native_contract
          cc -g -fsanitize=address,undefined -fno-omit-frame-pointer -I native native/region_contract.c -L build/native -labc_engine -Wl,-rpath,"$PWD/build/native" -o build/region_contract
      - name: Verify high-address WLD, PLR and region round trips
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          build/native_contract build/synthetic.wld build/synthetic-player.json
          build/region_contract build/objects.wld
      - name: Build complete native application engine
        run: |
          cmake -S native -B build/native-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-release --parallel 2
          echo "TERRAFORGE_ENGINE_LIBRARY=$PWD/build/native-release/libabc_engine.so" >> "$GITHUB_ENV"
          echo "TERRAFORGE_WORLD_FIXTURE=$PWD/build/synthetic.wld" >> "$GITHUB_ENV"
          echo "TERRAFORGE_CIRCUIT_FIXTURE=$PWD/build/circuit.wld" >> "$GITHUB_ENV"
          quickjs="$PUB_CACHE/hosted/pub.dev/flutter_js-0.8.7/linux/shared/libquickjs_c_bridge_plugin.so"
          test -f "$quickjs"
          echo "LIBQUICKJSC_TEST_PATH=$quickjs" >> "$GITHUB_ENV"
      - name: Native application tests with synthetic fixtures
        run: flutter test --no-pub --concurrency=1
      - name: Native circuit and fragment integration
        run: |
          dart run native/circuit_edit_smoke.dart
          dart run native/world_circuit_fragments_smoke.dart build/fragments.wld build/fragment-proof
      - name: Generate authoritative source and Web parity corpus
        run: |
          TERRA_CIRCUIT_SOURCE="$PWD/vendor/viewer-circuit" \
          TERRA_WORLD_RUNTIME="$PWD/web/engine/world.js" \
          TERRA_CIRCUIT_CORPUS="$PWD/qa-evidence/circuit-rules-corpus.json" \
          node tool/test_circuit_rules.mjs
      - name: QuickJS full rules runtime, all demos and shared corpus
        run: |
          flutter test --no-pub --concurrency=1 \
            native/circuit_rules_runtime_smoke_test.dart \
            native/circuit_rules_bundle_test.dart \
            native/circuit_rules_corpus_test.dart

  android:
    name: Android unsigned release build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --no-pub

  apple:
    name: macOS and unsigned iOS builds
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Configure macOS release
        run: flutter build macos --release --no-pub --config-only
      - name: Build macOS without signing
        run: xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release -derivedDataPath build/macos-ci CODE_SIGNING_ALLOWED=NO build
      - run: flutter build ios --release --no-pub --no-codesign

  linux:
    name: Linux desktop build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev zlib1g-dev
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release --no-pub
