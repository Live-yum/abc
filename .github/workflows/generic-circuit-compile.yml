name: Generic circuit compilation and synthetic UI review

on:
  push:
    branches: [codex/generic-circuit-compile-999b, codex/generic-timer-pixelbox-5c, codex/batched-reader-9d4-review]

permissions:
  contents: read

concurrency:
  group: generic-circuit-compile-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  compile-and-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Resolve existing locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format and preserve the exact SDK-parsed sources
        run: |
          set -euo pipefail
          mkdir -p build/generic-review
          dart format lib test native integration_test test_driver tool/perf tool/map_worker.dart | tee build/generic-review/format.log
          git diff --binary -- '*.dart' > build/generic-review/format.patch
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, tarfile
          root = pathlib.Path('.')
          paths = sorted(p for p in subprocess.check_output(['git', 'ls-files'], text=True).splitlines() if p.endswith('.dart'))
          rows = []
          with tarfile.open('build/generic-review/formatted-sources.tar.gz', 'w:gz') as archive:
              for path in paths:
                  data = (root / path).read_bytes()
                  rows.append({'path': path, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
                  archive.add(path, arcname=path, recursive=False)
          pathlib.Path('build/generic-review/source-manifest.json').write_text(json.dumps({'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'files': rows}, indent=2) + '\n')
          PY
      - name: Analyze final product and test sources
        id: analyze
        run: flutter analyze --no-pub
      - name: Focused generic controls, fixture driver and ownership contracts
        timeout-minutes: 8
        env:
          ABC_CIRCUIT_PAINTER_DIR: build/generic-review/painter-equivalence
        run: >-
          flutter test --no-pub --concurrency=1
          test/computerraria_computer_test.dart
          test/computer_provenance_test.dart
          test/computer_circuit_session_test.dart
          test/computer_workspace_test.dart
          test/world_circuit_load_workspace_test.dart
          test/computer_runtime_batch_test.dart
          test/world_circuit_progress_lifecycle_test.dart
          test/world_circuit_runtime_notifications_test.dart
          test/generic_circuit_runtime_test.dart
          test/circuit_display_region_test.dart
          test/generic_circuit_profile_selection_test.dart
          test/world_circuit_panel_test.dart
          test/world_circuit_painter_test.dart
          test/world_circuit_confirmation_lifecycle_test.dart
          test/workspace_view_snapshot_test.dart
          test/workspace_circuit_updates_test.dart
      - name: Confirm the prior panel reproduces the disposal defect
        timeout-minutes: 5
        run: |
          set -euo pipefail
          baseline=c61d7a1d8c5155515808611fdf2c3b5992b666f3
          control="$RUNNER_TEMP/c61-confirmation-control"
          git cat-file -e "$baseline^{commit}"
          git worktree add --detach "$control" "$baseline"
          cp test/world_circuit_confirmation_lifecycle_test.dart "$control/test/"
          (
            cd "$control"
            flutter pub get --enforce-lockfile
          )
          set +e
          (
            cd "$control"
            flutter test --no-pub --concurrency=1 test/world_circuit_confirmation_lifecycle_test.dart
          ) > build/generic-review/confirmation-negative-control.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > build/generic-review/confirmation-negative-control.exit
          test "$result" -ne 0
          grep -F 'setState() called after dispose' build/generic-review/confirmation-negative-control.log
      - name: Real shared-theme desktop and mobile synthetic screenshots
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        timeout-minutes: 4
        env:
          ABC_GENERIC_VISUAL_DIR: build/generic-review/visual
        run: flutter test --no-pub --update-goldens test/generic_circuit_visual_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: generic-circuit-review-${{ github.sha }}
          path: build/generic-review/
          if-no-files-found: error
          retention-days: 30

  native-lights:
    name: Source-oracle lights and timers / Native contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake zlib1g-dev
      - name: Native sanitizer footprint and existing wiring contracts
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          mkdir -p build/light-review
          cmake -S native -B build/native-asan -DABC_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-asan --parallel 2
          for contract in circuit_device_epoch_contract circuit_wld_pixel_contract circuit_wired_light_contract circuit_timer_order_contract; do
            cc -g -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer -I native/vendor/TerraWasm/include -I native/vendor/TerraWasm/src "native/$contract.c" build/native-asan/terra/libterrax_world_static.a -lm -lz -o "build/$contract"
            "build/$contract" | tee "build/light-review/$contract.log"
          done
      - name: Full WLD light fixtures, rollback, save and reopen
        run: |
          set -euo pipefail
          cmake -S native -B build/native-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-release --parallel 2
          python3 tool/test_wired_lights.py build/native-release/libabc_engine.so --output build/light-review/native-lights.json
          python3 tool/test_timer_fifo.py build/native-release/libabc_engine.so --output build/light-review/native-timers.json
          python3 tool/test_timer_gate_origins.py build/native-release/libabc_engine.so --output build/light-review/native-timer-gates.json
      - name: Check out the frozen batched-reader reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 9d4cd5a0f9db03042a3986689fea374ba92d78b8
          path: build/batched-reader-reference
          persist-credentials: false
      - name: Frozen-reference reader differential in Release and ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          reference="$PWD/build/batched-reader-reference"
          test "$(git -C "$reference" rev-parse HEAD)" = 9d4cd5a0f9db03042a3986689fea374ba92d78b8
          test -z "$(git -C "$reference" status --porcelain --untracked-files=normal)"
          cmake -S "$reference/native" -B build/batched-reader-reference-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build/batched-reader-reference-release --target terrax_world_static --parallel 2
          cmake -S "$reference/native" -B build/batched-reader-reference-asan -DABC_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/batched-reader-reference-asan --target terrax_world_static --parallel 2
          python3 tool/test_batched_reader.py --mode release \
            --reference-source "$reference/native/vendor/TerraWasm" \
            --candidate-source native/vendor/TerraWasm \
            --reference-archive build/batched-reader-reference-release/terra/libterrax_world_static.a \
            --candidate-archive build/native-release/terra/libterrax_world_static.a \
            --output build/batched-reader-contracts/release
          python3 tool/test_batched_reader.py --mode sanitized \
            --reference-source "$reference/native/vendor/TerraWasm" \
            --candidate-source native/vendor/TerraWasm \
            --reference-archive build/batched-reader-reference-asan/terra/libterrax_world_static.a \
            --candidate-archive build/native-asan/terra/libterrax_world_static.a \
            --output build/batched-reader-contracts/sanitized
      - name: Verify and remove only the temporary batched-reader reference checkout
        if: always()
        run: |
          set -euo pipefail
          reference="$PWD/build/batched-reader-reference"
          if [[ -d "$reference/.git" ]]; then
            test "$(git -C "$reference" rev-parse HEAD)" = 9d4cd5a0f9db03042a3986689fea374ba92d78b8
            test -z "$(git -C "$reference" status --porcelain --untracked-files=normal)"
            rm -rf -- "$reference"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: batched-reader-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/batched-reader-contracts/*/report.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-light-review-${{ github.sha }}
          path: build/light-review/
          if-no-files-found: error
          retention-days: 30

  visible-pixelbox-persistence:
    name: Actual native PixelBox UI / saved WLD reopen
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Resolve locked dependencies and build the real native backend
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y build-essential cmake zlib1g-dev
          flutter pub get --enforce-lockfile
          cmake -S native -B build/native-visible -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-visible --parallel 2
          python3 tool/generate_visible_pixelbox_fixture.py --check test/fixtures/generic-circuit/synthetic-visible-pixelbox.wld
      - name: Mounted shared-theme app, visible OFF/ON pixels, save and new-owner reopen
        timeout-minutes: 8
        env:
          ABC_VISIBLE_PIXELBOX_DIR: build/visible-pixelbox-review
        run: |
          set -euo pipefail
          mkdir -p "$ABC_VISIBLE_PIXELBOX_DIR"
          export TERRAFORGE_ENGINE_LIBRARY="$PWD/build/native-visible/libabc_engine.so"
          flutter test --no-pub --concurrency=1 --update-goldens test/visible_pixelbox_persistence_test.dart 2>&1 | tee "$ABC_VISIBLE_PIXELBOX_DIR/test.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: visible-pixelbox-review-${{ github.sha }}
          path: build/visible-pixelbox-review/
          if-no-files-found: error
          retention-days: 30

  web-lights:
    name: Source-oracle lights and timers / rebuilt Web engine
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned official Emscripten
        run: |
          git clone --depth 1 --branch 5.0.7 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "41190c21c662e9cc1962aea94e71cbae9fd2fc87"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.7
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.7
      - name: Build, record and validate actual engine artifacts
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ABC_WEB_OUTPUT="$PWD/web/engine" bash tool/build_web_engine.sh
          node tool/record_web_engine.mjs
          python3 -m unittest discover -s tool -p 'authorized_source_additions_test.py'
          python3 tool/verify_authorized_sources.py
      - name: Check out the frozen batched-reader reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 9d4cd5a0f9db03042a3986689fea374ba92d78b8
          path: build/batched-reader-reference
          persist-credentials: false
      - name: Actual WASM reader differential against frozen 9d4
        run: |
          set -euo pipefail
          reference="$PWD/build/batched-reader-reference"
          test "$(git -C "$reference" rev-parse HEAD)" = 9d4cd5a0f9db03042a3986689fea374ba92d78b8
          test -z "$(git -C "$reference" status --porcelain --untracked-files=normal)"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          test "$(emcc -dumpversion)" = 5.0.7
          emcmake cmake -S "$reference/native/vendor/TerraWasm" -B build/batched-reader-reference-wasm \
            -DCMAKE_BUILD_TYPE=Release -DABC_HOST_WRAPPERS="$reference/native" \
            -DTERRAWASM_FEATURE_SET=wld -DTERRAX_BUILD_COMMIT=e2c3c817b2b482a535763695d19945971e19e41c \
            -DTERRAX_BUILD_DIRTY=true -DTERRAX_BUILD_COMPILER=emscripten-5.0.7 \
            -DTERRAX_WEB_MAXIMUM_MEMORY=268435456
          cmake --build build/batched-reader-reference-wasm --target terrax_world_wasm_web --parallel 4
          python3 tool/test_batched_reader.py --mode wasm \
            --reference-source "$reference/native/vendor/TerraWasm" \
            --candidate-source native/vendor/TerraWasm \
            --reference-web-build build/batched-reader-reference-wasm \
            --candidate-web-build build/wasm-wld \
            --output build/batched-reader-contracts/wasm
      - name: Verify and remove only the temporary batched-reader reference checkout
        if: always()
        run: |
          set -euo pipefail
          reference="$PWD/build/batched-reader-reference"
          if [[ -d "$reference/.git" ]]; then
            test "$(git -C "$reference" rev-parse HEAD)" = 9d4cd5a0f9db03042a3986689fea374ba92d78b8
            test -z "$(git -C "$reference" status --porcelain --untracked-files=normal)"
            rm -rf -- "$reference"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: batched-reader-wasm-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/batched-reader-contracts/wasm/report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Execute shared original light WLD scenarios in real WASM
        run: |
          set -euo pipefail
          mkdir -p build/light-web-review
          python3 tool/test_wired_lights.py --export-fixtures build/light-fixtures
          node test/web/world_circuit_lights_contract.cjs web/engine/world.js web/engine/world.wasm build/light-fixtures | tee build/light-web-review/contract.log
          python3 tool/test_timer_fifo.py --export-fixtures build/timer-fixtures
          node test/web/world_circuit_timer_contract.cjs web/engine/world.js web/engine/world.wasm build/timer-fixtures | tee build/light-web-review/timers-contract.log
          tar -czf build/light-web-review/verified-web-engine.tar.gz web/engine/world.js web/engine/world.wasm web/engine/player.js web/engine/player.wasm web/engine/manifest.json web/engine/circuit_rules.engine-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: web-light-review-${{ github.sha }}
          path: build/light-web-review/
          if-no-files-found: error
          retention-days: 30
